services:
  web:
    build: .
    image: erine-portfolio:local
    ports:
      - "3000:3000"
    environment:
      # Compose reads these from a .env file next to this file (or your shell).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    restart: unless-stopped
